<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>订单配置规则</title><link rel="stylesheet" href="style.css"></head><body class="rules-page">
<header><div class="heading"><h1>订单配置规则</h1><span id="badge" class="badge"></span><div class="top-actions"><a href="./">车型配置</a><button id="template">下载模板</button><button id="import">批量导入</button><button id="export">导出 Excel</button><input id="file" type="file" accept=".xlsx" multiple hidden></div></div><nav id="tabs" aria-label="规则分类"></nav></header>
<main><div class="filters"><label class="search">搜索<input id="search" type="search"></label><button id="sync">从脚本重新载入</button><span class="muted">业务报表：未重新生成</span></div><div id="notice" role="status"></div><section class="panel"><div class="panel-head"><h2 id="title"></h2><div><button id="batch">批量粘贴</button><button id="add">新增规则</button></div></div><div id="content" class="scroll"></div></section></main>
<footer><div><span id="status"></span><button id="undo">撤销</button></div><div class="save-actions"><button id="reload">重新载入草稿</button><button id="save">保存草稿</button><button id="publish" class="primary">发布并更新脚本</button></div></footer>
<dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="close" aria-label="关闭">×</button></div><div id="error" role="alert" class="error" tabindex="-1"></div><div id="body"></div><div class="dialog-actions"><button id="cancel">取消</button><button id="confirm" class="primary">确定</button></div></dialog><script src="rules.js" defer></script></body></html>
