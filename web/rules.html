<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>订单配置规则</title><link rel="stylesheet" href="style.css"></head><body class="rules-page">
<header><div class="heading"><h1 class="product-title"><svg class="title-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 21v-7m0-4V3m8 18v-9m0-4V3m8 18v-3m0-4V3"/><path d="M1 14h6m2-6h6m2 10h6"/></svg>订单配置规则</h1><span id="badge" class="badge"></span><div class="top-actions"><a href="./" title="车型配置" aria-label="车型配置"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19 12H5m6-6-6 6 6 6"/></svg><span>车型配置</span></a><button id="template" title="下载模板" aria-label="下载模板"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 3h8l4 4v14H5V3h2Zm7 0v5h5m-7 2v7m-3-3 3 3 3-3"/></svg><span>下载模板</span></button><button id="import" class="primary" title="批量导入" aria-label="批量导入"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 16V3m-5 5 5-5 5 5M4 15v5h16v-5"/></svg><span>批量导入</span></button><button id="export" title="导出 Excel" aria-label="导出 Excel"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3v13m-5-5 5 5 5-5M4 16v4h16v-4"/></svg><span>导出 Excel</span></button><input id="file" type="file" accept=".xlsx" multiple hidden></div></div><nav id="tabs" aria-label="规则分类"></nav></header>
