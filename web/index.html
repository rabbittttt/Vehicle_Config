<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>车型配置管理</title><script src="frame-account.js"></script><link rel="stylesheet" href="style.css"></head><body>
<header>
  <div class="heading">
    <div class="heading-identity"><h1 class="product-title"><svg class="title-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 21v-7m0-4V3m8 18v-9m0-4V3m8 18v-3m0-4V3"/><path d="M1 14h6m2-6h6m2 10h6"/></svg>车型配置</h1></div>
    <button type="button" class="mobile-filter-toggle" aria-expanded="false" aria-controls="catalog-filters">筛选</button>
    <div id="catalog-filters" class="filters" role="group" aria-label="筛选">
      <label id="model-filter-label">车型<select id="model"></select></label>
      <label id="year-filter-label">年款<select id="year"></select></label>
      <label class="search" id="search-filter-label">搜索<input id="search" type="search" placeholder="代际、产品档位或能源"></label>
      <button id="clear-filters" class="quiet" hidden>清空筛选</button>
    </div>
  </div>
  <div class="top-actions">
    <button id="template" hidden title="下载模板" aria-label="下载模板"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 3h8l4 4v14H5V3h2Zm7 0v5h5m-7 2v7m-3-3 3 3 3-3"/></svg><span>模板</span></button>
    <button id="import" hidden class="primary" title="批量导入" aria-label="批量导入"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 16V3m-5 5 5-5 5 5M4 15v5h16v-5"/></svg><span>批量导入</span></button>
    <button id="export" title="导出 Excel" aria-label="导出 Excel"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3v13m-5-5 5 5 5-5M4 16v4h16v-4"/></svg><span>导出</span></button>
    <input id="file" type="file" accept=".xlsx" multiple hidden>
  </div>
  <nav aria-label="配置管理">
    <button data-tab="schedule" class="active" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 5h6l2 3h10v11H3z"/></svg>车型与日程</button>
    <button data-tab="generation"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 7h15m-4-4 4 4-4 4M20 17H5m4-4-4 4 4 4"/></svg>代际规则</button>
    <button data-tab="options"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 6h16M4 12h16M4 18h16M8 4v4m7 2v4m-5 2v4"/></svg>电池与选配</button>
    <button data-tab="reporting"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 6h16v15H4zM4 10h16M8 3v5m8-5v5m-8 8 3-3 2 2 3-4"/></svg>小订首销填报</button>
    <button data-tab="history"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 11a9 9 0 1 1 2 7M3 4v7h7m2-4v5l3 2"/></svg>变更记录</button>
  </nav>
  <div class="data-tools">
    <button type="button" id="data-tools" aria-controls="data-tools-panel" aria-expanded="false">数据工具<svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></button>
    <div id="data-tools-panel" role="group" aria-labelledby="data-tools" hidden>
      <label id="owner-label" hidden>维护人<input id="owner" maxlength="100" autocomplete="off"></label>
      <button type="button" id="reload-rules" disabled>从脚本重新载入</button>
      <button type="button" id="campaign-import" disabled>导入小订首销旧表</button>
      <button type="button" id="campaign-undo-import" hidden>撤销旧表导入</button>
      <button type="button" data-runtime>运行路径</button>
    </div>
    <input type="file" id="campaign-file" accept=".xlsx" hidden>
  </div>
</header>
<main>
  <section class="panel">
    <div class="view-toolbar">
      <div id="view-tabs" class="view-tabs" role="group" aria-label="编辑视图"></div>
      <div id="actions"></div>
    </div>
    <div id="content"></div>
    <div class="results-summary">
      <span id="count" class="muted"></span>
      <div id="pagination" class="pagination"></div>
    </div>
  </section>
</main>
<footer><div><span id="status" role="status" aria-live="polite">正在载入…</span><span id="notice" role="status"></span><span id="error-notice" role="alert"></span><button id="error-detail" class="link" hidden>查看错误</button><div class="undo-actions"><button id="undo" aria-keyshortcuts="Control+Z Meta+Z" title="撤销（Ctrl / ⌘ + Z）" class="quiet" disabled>撤销</button><button id="redo" aria-keyshortcuts="Control+Y Meta+Shift+Z" title="重做（Ctrl + Y / ⌘ + Shift + Z）" class="quiet" disabled>重做</button></div></div><div class="save-actions"><button id="reload">重新载入草稿</button><button id="save" disabled>保存草稿</button><button id="publish" class="primary" disabled>发布配置</button></div></footer>
<dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="close" aria-label="关闭">×</button></div><div id="dialog-error" class="error" role="alert"></div><div id="dialog-body"></div><div class="dialog-actions"><button id="cancel">取消</button><button id="confirm" class="primary">确定</button></div></dialog><script src="rules.js" defer></script><script src="campaign.js" defer></script><script src="app.js" defer></script></body></html>
