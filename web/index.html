<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>车型配置管理</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="heading"><h1>车型配置</h1><span id="published" class="badge">未发布</span><div class="top-actions"><button id="import">导入 Excel</button><button id="export">导出 Excel</button><input id="file" type="file" accept=".xlsx" hidden></div></div><nav aria-label="配置管理"><button data-tab="models" class="active">车型档案</button><button data-tab="matrix">版本与选配</button><button data-tab="aliases">名称映射</button><button data-tab="groups">汇总规则</button><button data-tab="history">变更记录</button></nav></header>
<main><div class="filters"><label>车型<select id="model"></select></label><label>年款<select id="year"></select></label><label class="search">搜索<input id="search" type="search" placeholder="名称或编号"></label><span class="muted" id="consumer">业务报表：尚未接入</span></div><div id="notice" role="status" aria-live="polite"></div><section class="panel"><div class="panel-head"><h2 id="title">车型档案</h2><div id="actions"></div></div><div id="content"></div></section></main>
<footer><span id="status">正在载入…</span><div><button id="reload">重新载入</button><button id="save" disabled>保存草稿</button><button id="publish" class="primary" disabled>发布配置</button></div></footer>
<dialog id="dialog"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="close" aria-label="关闭">×</button></div><div id="dialog-body"></div><div class="dialog-actions"><button id="cancel">取消</button><button id="confirm" class="primary">确定</button></div></dialog><script src="app.js" defer></script></body></html>
