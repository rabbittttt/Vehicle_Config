<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>车型配置管理</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="heading"><h1 class="product-title"><svg class="title-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 21v-7m0-4V3m8 18v-9m0-4V3m8 18v-3m0-4V3"/><path d="M1 14h6m2-6h6m2 10h6"/></svg>车型配置</h1><span id="published" class="badge" hidden></span><div class="top-actions"><button id="template">下载模板</button><button id="import">批量导入</button><button id="export">导出 Excel</button><input id="file" type="file" accept=".xlsx" multiple hidden></div></div><nav aria-label="配置管理"><button data-tab="models" class="active">车型档案</button><button data-tab="matrix">版本与选配</button><button data-tab="aliases">名称映射</button><button data-tab="groups">汇总规则</button><button data-tab="history">变更记录</button><a href="rules.html">订单配置规则</a></nav></header>
<main><div class="filters"><label>车型<select id="model"></select></label><label>年款<select id="year"></select></label><label id="status-filter-label">状态<select id="status-filter"><option value="">全部状态</option>规划</option><option>在售</option><option>停用</option></select></label><label class="search">搜索<input id="search" type="search" placeholder="名称、品牌或编号"></label><button id="clear-filters" class="quiet">清空筛选</button><span class="muted" id="consumer">业务报表：尚未接入</span></div>
<div id="notice" role="status" aria-live="polite"></div><section class="panel"><div class="panel-head"><div><h2 id="title">车型档案</h2><span class="muted" id="count"></span></div><div id="actions"></div></div><div id="view-tabs" class="view-tabs" aria-label="编辑视图"></div><div id="bulkbar" class="bulkbar"></div><div id="content"></div><div id="pagination" class="pagination"></div></section></main>
<footer><div><span id="status" role="status" aria-live="polite">正在载入…</span><div class="undo-actions"><button id="undo" class="quiet" disabled>撤销</button><button id="redo" class="quiet" disabled>重做</button></div></div><div class="save-actions"><button id="reload">重新载入</button><button id="save" disabled>保存草稿</button><button id="publish" class="primary" disabled>发布配置</button></div></footer>
<dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="close" aria-label="关闭">×</button></div><div id="dialog-error" class="error" role="alert"></div><div id="dialog-body"></div><div class="dialog-actions"><button id="cancel">取消</button><button id="confirm" class="primary">确定</button></div></dialog><script src="app.js" defer></script></body></html>
