<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>车型配置管理</title><link rel="stylesheet" href="style.css"></head><body>
<header>
  <div class="heading"><h1 class="product-title"><svg class="title-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 21v-7m0-4V3m8 18v-9m0-4V3m8 18v-3m0-4V3"/><path d="M1 14h6m2-6h6m2 10h6"/></svg>车型配置</h1><span id="published" class="badge" hidden></span><div class="top-actions"><button id="template" title="下载模板" aria-label="下载模板"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 3h8l4 4v14H5V3h2Zm7 0v5h5m-7 2v7m-3-3 3 3 3-3"/></svg><span>下载模板</span></button><button id="import" class="primary" title="批量导入" aria-label="批量导入"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 16V3m-5 5 5-5 5 5M4 15v5h16v-5"/></svg><span>批量导入</span></button><button id="export" title="导出 Excel" aria-label="导出 Excel"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3v13m-5-5 5 5 5-5M4 16v4h16v-4"/></svg><span>导出 Excel</span></button><input id="file" type="file" accept=".xlsx" multiple hidden></div></div>
  <nav aria-label="配置管理"><button data-tab="models" class="active"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 5h6l2 3h10v11H3z"/></svg>车型档案</button><button data-tab="matrix"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 3h18v18H3zM3 10h18M10 10v11"/></svg>版本与选配</button><button data-tab="aliases"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 7h15m-4-4 4 4-4 4M20 17H5m4-4-4 4 4 4"/></svg>名称映射</button><button data-tab="groups"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 6h16M4 12h16M4 18h16M8 4v4m7 2v4m-5 2v4"/></svg>汇总规则</button><button data-tab="history"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 11a9 9 0 1 1 2 7M3 4v7h7m2-4v5l3 2"/></svg>变更记录</button></nav>
  <div class="filters" role="group" aria-label="筛选">
    <label id="model-filter-label">车型<select id="model"></select></label>
    <label id="year-filter-label">年款<select id="year"></select></label>
    <label id="status-filter-label">状态<select id="status-filter"><option value="">全部状态</option><option>规划</option><option>在售</option><option>停用</option></select></label>
    <label id="category-filter-label" hidden>类别<select id="category-filter"></select></label>
    <label id="state-filter-label" hidden>配置状态<select id="state-filter"></select></label>
    <label class="search" id="search-filter-label">搜索<input id="search" type="search" placeholder="名称、品牌或编号"></label>
    <button id="clear-filters" class="quiet">清空筛选</button>
    <span class="muted" id="consumer">业务报表：尚未接入</span>
  </div>
</header>
<main>
<div id="notice" role="status" aria-live="polite"></div><section class="panel"><div class="panel-head"><div><h2 id="title">车型档案</h2><span class="muted" id="count"></span></div><div id="actions"></div></div><div id="view-tabs" class="view-tabs" aria-label="编辑视图"></div><div id="bulkbar" class="bulkbar"></div><div id="content"></div><div id="pagination" class="pagination"></div></section></main>
<footer><div><span id="status" role="status" aria-live="polite">正在载入…</span><div class="undo-actions"><button id="undo" class="quiet" disabled>撤销</button><button id="redo" class="quiet" disabled>重做</button></div></div><div class="save-actions"><button id="reload">重新载入</button><button id="save" disabled>保存草稿</button><button id="publish" class="primary" disabled>发布配置</button></div></footer>
<dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="close" aria-label="关闭">×</button></div><div id="dialog-error" class="error" role="alert"></div><div id="dialog-body"></div><div class="dialog-actions"><button id="cancel">取消</button><button id="confirm" class="primary">确定</button></div></dialog><script src="rules.js" defer></script><script src="app.js" defer></script></body></html>
